name: offline-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python demo.py
      - run: python demo_execution.py
      - run: python -m compileall -q gate.py execution.py fixtures.py demo.py demo_execution.py test_gate.py test_execution.py
