name: offline-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, previously resolved by CI
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, previously resolved by CI
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python demo.py
      - run: python demo_execution.py
      - run: python -m compileall -q gate.py execution.py fixtures.py review.py review_server.py demo.py demo_execution.py demo_review.py test_gate.py test_execution.py test_review.py test_revocation.py kubernetes_local.py integration/run.py
