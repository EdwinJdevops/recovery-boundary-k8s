apiVersion: v1
kind: Namespace
metadata:
  name: recovery-boundary-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: recovery-boundary-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recovery-boundary-demo
  template:
    metadata:
      labels:
        app: recovery-boundary-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: recovery-boundary-demo:test
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            periodSeconds: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: recovery-boundary-demo
spec:
  selector:
    app: recovery-boundary-demo
  ports:
    - port: 8080
      targetPort: 8080
